<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><script src="config.js"></script><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review moderation | QEVNIX</title><link rel="stylesheet" href="styles.css"></head><body><main class="page-body"><div class="wrap" style="max-width:900px"><h1>QEVNIX Review Moderation</h1><p>Private admin page. Keep your review token secret.</p><label for="token">Admin review token</label><input id="token" type="password" autocomplete="off" style="display:block;width:100%;max-width:500px;padding:12px;margin:8px 0 14px;border:1px solid #ccd3dd;border-radius:8px"><button class="btn btn-primary" id="load">Load submissions</button><p id="msg" role="status"></p><div id="items"></div></div></main><script>
const token=document.getElementById('token'),items=document.getElementById('items'),msg=document.getElementById('msg');
async function request(url,options={}){const r=await fetch(url,{...options,headers:{'Content-Type':'application/json','x-admin-token':token.value,...(options.headers||{})}});const d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');return d;}
function esc(s){const x=document.createElement('span');x.textContent=s;return x.innerHTML;}
async function load(){try{const d=await request('/api/admin/reviews');items.innerHTML='';if(!d.reviews.length){items.textContent='No submissions yet.';return;}d.reviews.slice().reverse().forEach(v=>{const card=document.createElement('article');card.className='panel';card.style.marginTop='14px';card.innerHTML='<strong>'+esc(v.name)+'</strong> · '+v.rating+'/5 · <b>'+esc(v.status)+'</b><p>'+esc(v.message)+'</p><small>'+esc(v.createdAt)+'</small><div style="display:flex;gap:10px;margin-top:12px"><button class="btn btn-primary" data-status="approved">Approve</button><button class="btn btn-outline" data-status="rejected">Reject</button></div>';card.querySelectorAll('button').forEach(b=>b.addEventListener('click',async()=>{try{await request('/api/admin/reviews/'+encodeURIComponent(v.id),{method:'PATCH',body:JSON.stringify({status:b.dataset.status})});load();}catch(e){msg.textContent=e.message;}}));items.appendChild(card);});msg.textContent='Loaded '+d.reviews.length+' review(s).';}catch(e){msg.textContent=e.message;}}
document.getElementById('load').addEventListener('click',load);
</script></body></html>
