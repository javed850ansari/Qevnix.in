<!doctype html>
<html lang="en"><head><meta charset="utf-8"><script src="config.js"></script><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Payment status | QEVNIX</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="section"><div class="wrap" style="max-width:640px">
<h1 id="title">Checking your payment…</h1>
<p class="lead" id="status">Please wait while QEVNIX confirms your payment with Razorpay.</p>
<p style="margin-top:28px"><a class="btn btn-primary" href="index.html">Back to QEVNIX</a></p>
</div></main>
<script>
(async()=>{
 const orderId=new URLSearchParams(location.search).get("order_id");
 const title=document.getElementById("title"), el=document.getElementById("status");
 if(!orderId){title.textContent="Order not found";el.textContent="Order reference missing. Please contact QEVNIX on WhatsApp.";return;}
 try{
  const r=await fetch("/api/payments/order/"+encodeURIComponent(orderId));
  const d=await r.json();
  if(!r.ok) throw new Error(d.error||"Could not check your payment.");
  if(d.paid){title.textContent="Payment successful";el.textContent="Thank you for choosing QEVNIX! We will contact you on WhatsApp shortly to start your project.";}
  else if(d.orderStatus==="attempted"){title.textContent="Payment pending";el.textContent="Your payment is still being processed, or was not completed. If money was debited, please message us on WhatsApp with your order ID: "+d.orderId;}
  else{title.textContent="No payment received";el.textContent="We have not received a payment for this order yet.";}
 }catch(e){title.textContent="Something went wrong";el.textContent=e.message;}
})();
</script></body></html>
