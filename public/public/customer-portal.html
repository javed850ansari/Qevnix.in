<!doctype html><html lang="en"><head><meta charset="utf-8"><script src="config.js"></script><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Project Portal | QEVNIX</title><style>
*{box-sizing:border-box}body{margin:0;font:16px/1.5 Arial,sans-serif;background:#f5f7fb;color:#182033}.wrap{max-width:900px;margin:40px auto;padding:20px}.card{background:white;border:1px solid #e4e8f0;border-radius:18px;padding:24px;margin:16px 0;box-shadow:0 8px 28px #1820330a}h1{margin:0 0 8px}p{color:#667085}label{display:block;font-weight:600;margin:12px 0 6px}input{width:100%;padding:13px;border:1px solid #ccd3df;border-radius:10px;font:inherit}button{border:0;background:#172554;color:white;padding:13px 18px;border-radius:10px;font-weight:700;cursor:pointer;margin-top:14px}.muted{color:#667085}.hidden{display:none}.project{border:1px solid #e4e8f0;border-radius:14px;padding:18px;margin:14px 0}.pill{display:inline-block;padding:5px 10px;border-radius:99px;background:#eef2ff;color:#263b80;font-size:13px;margin:5px 6px 5px 0}.error{color:#b42318}.success{color:#067647}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}a{color:#243b80}
</style></head><body><main class="wrap"><div class="top"><div><strong>QEVNIX</strong><p>Customer Project Portal</p></div><a href="index.html">Back to website</a></div><section class="card" id="loginBox"><h1>Customer Login</h1><p>Use the email and password shared by QEVNIX.</p><form id="loginForm"><label>Email address</label><input name="email" type="email" required autocomplete="username"><label>Password</label><input name="password" type="password" required autocomplete="current-password"><button type="submit">Login to my projects</button></form><p id="loginMessage" role="status"></p></section><section class="card hidden" id="dashboard"><div class="top"><div><h1>My Projects</h1><p id="welcome"></p></div><button id="logout">Logout</button></div><div id="projects"></div></section></main><script>
const API='';const $=s=>document.querySelector(s);let token=sessionStorage.getItem('qevnix_customer_token');
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){if(!token)return;try{const r=await fetch(API+'/api/customer/projects',{headers:{Authorization:'Bearer '+token}});const d=await r.json();if(!r.ok)throw Error(d.error||'Please login again');$('#loginBox').classList.add('hidden');$('#dashboard').classList.remove('hidden');$('#welcome').textContent='Welcome, '+d.customer.name+' ('+d.customer.email+')';$('#projects').innerHTML=d.projects.length?d.projects.map(p=>`<article class="project"><h2>${esc(p.title)}</h2><p>${esc(p.description||'No additional project notes yet.')}</p><div class="grid"><div><small>Project status</small><br><span class="pill">${esc(p.status)}</span></div><div><small>Payment status</small><br><span class="pill">${esc(p.paymentStatus)}</span></div><div><small>Total amount</small><br><b>₹${Number(p.totalAmount).toLocaleString('en-IN')}</b></div><div><small>Paid amount</small><br><b>₹${Number(p.paidAmount).toLocaleString('en-IN')}</b></div><div><small>Balance due</small><br><b>₹${Number(p.balanceAmount).toLocaleString('en-IN')}</b></div></div><p class="muted">Last updated: ${p.updatedAt?new Date(p.updatedAt).toLocaleString('en-IN'):'—'}</p></article>`).join(''):'<p>No projects have been assigned to your account yet. Please contact QEVNIX.</p>';}catch(e){sessionStorage.removeItem('qevnix_customer_token');token=null;$('#loginBox').classList.remove('hidden');$('#loginMessage').textContent=e.message;}}
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.currentTarget);$('#loginMessage').textContent='Signing in…';try{const r=await fetch('/api/customer/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:f.get('email'),password:f.get('password')})});const d=await r.json();if(!r.ok)throw Error(d.error||'Login failed');token=d.token;sessionStorage.setItem('qevnix_customer_token',token);await load();}catch(err){$('#loginMessage').textContent=err.message;$('#loginMessage').className='error';}});
$('#logout').addEventListener('click',async()=>{if(token)await fetch('/api/customer/logout',{method:'POST',headers:{Authorization:'Bearer '+token}});sessionStorage.removeItem('qevnix_customer_token');token=null;$('#dashboard').classList.add('hidden');$('#loginBox').classList.remove('hidden');$('#loginMessage').textContent='You have logged out.';});load();
</script></body></html>
